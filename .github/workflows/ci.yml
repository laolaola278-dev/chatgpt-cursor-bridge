name: validation

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r local-bridge/requirements.txt
      - run: python -m compileall -q local-bridge/app local-bridge/tests
      - run: cd local-bridge && pytest -q
      - run: cd local-bridge && pytest -q tests/security

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: cd browser-extension && npm ci
      - run: cd browser-extension && npm run typecheck
      - run: cd browser-extension && npm test -- --run
      - run: cd browser-extension && npm run build
